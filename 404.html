<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Página não encontrada — Rodrigo Barros</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23020403'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='%23ff2b3d'%3Erb%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#020403;--card:#0b0d0c;--ink:#e4efe9;--muted:#7d8f86;--line:#231416;--accent:#ff2b3d;--accent-ink:#160306}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line)}
header .wrap{height:64px;display:flex;align-items:center}
header a{font-weight:700;color:var(--ink);text-decoration:none}
main{padding:80px 0}
.code{font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0 0 12px}
h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.02em;line-height:1.15;margin:0 0 12px}
p{color:var(--muted);margin:0 0 28px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;padding:12px 18px;border-radius:10px;font-weight:600;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:var(--card)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
</style>
</head>
<body>
<header><div class="wrap"><a href="/">Rodrigo Barros</a></div></header>
<main>
  <div class="wrap">
    <p class="code">Erro 404</p>
    <h1>Esta página não existe.</h1>
    <p>O endereço pode ter mudado ou ter sido digitado errado. O conteúdo do site está todo na página inicial.</p>
    <div class="cta">
      <a class="btn primary" href="/">Ir para o início</a>
      <a class="btn" href="/#contato">Falar comigo</a>
    </div>
  </div>
</main>
</body>
</html>
